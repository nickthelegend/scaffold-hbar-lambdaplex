name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Test, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: yarn

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install
        run: yarn install --immutable

      - name: SDK unit tests (signing vectors, rules, TWAP)
        run: yarn lambdaplex:test

      - name: StrategyRegistry tests
        run: yarn foundry:test

      - name: Frontend unit tests
        run: yarn next:test

      - name: Types
        run: yarn next:check-types

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn next:build

  live:
    name: SDK against the live Lambdaplex API
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Live public API, dry-run TWAP
        run: yarn lambdaplex:test:live

  scaffold:
    name: Fresh scaffold with create-scaffold-hbar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Configure git and Yarn
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          corepack enable

      - name: Scaffold this commit exactly as a user would
        run: npm create scaffold-hbar@latest judge -- --template ${{ github.repository }}#${{ github.sha }} --skip-hedera-skills --yes

      - name: Test, type-check, build and lint the scaffolded project
        working-directory: judge
        run: yarn lambdaplex:test && yarn foundry:test && yarn next:test && yarn next:check-types && yarn next:build && yarn lint

      - name: Hedera Harness validators on the scaffolded project
        working-directory: judge
        run: |
          npx playwright install --with-deps chromium
          yarn harness:validate

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Test, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: yarn

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install
        run: yarn install --immutable

      - name: SDK unit tests (signing vectors, rules, TWAP)
        run: yarn lambdaplex:test

      - name: StrategyRegistry tests
        run: yarn foundry:test

      - name: Frontend unit tests
        run: yarn next:test

      - name: Types
        run: yarn next:check-types

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn next:build

  live:
    name: SDK against the live Lambdaplex API
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Live public API, dry-run TWAP
        run: yarn lambdaplex:test:live
